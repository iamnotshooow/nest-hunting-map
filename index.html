<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nest Hunting Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Mochiy+Pop+One&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* 設計：粉彩日系普普風（參考：Knock the toilet／骨格診断／さくラボ）。
   奶油方格紙底＋深藍線框＋硬陰影的復古視窗；刻意只做淺色一種外觀。 */
:root{
  --paper:#FBF6EC; --grid:rgba(238,122,154,.16); --surface:#FFFFFF; --ink:#2B3A67; --muted:#6B7494;
  --pink:#F7B8C8; --sky:#BFE6F2; --butter:#FFE58F; --mint:#BDEBD3; --hot:#EE5A86;
  --accent:#2B3A67; --accent-ink:#FFFFFF; --chip-bg:#F3EEF7; --border:#2B3A67;
  --grade-a:#8FDDB4; --grade-b:#8ED3EA; --grade-c:#FFD27A; --grade-d:#F59AB0; --grade-x:#D6D9E3;
  --fav:#F2B200; --new:#EE5A86;
  --shadow:4px 4px 0 var(--ink); --shadow-s:3px 3px 0 var(--ink);
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-pop:"Mochiy Pop One",var(--font-body);
  --font-pixel:"DotGothic16",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body); color:var(--ink); display:flex; flex-direction:column; gap:14px;
  padding-block:14px; padding-inline:16px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
}
button{font-family:inherit}

/* ---- header：貼紙感標題＋膠囊計數 ---- */
header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; flex:0 0 auto}
.brand{display:flex; align-items:center; gap:10px}
header h1{
  margin:0; font-family:var(--font-pop); font-weight:400; font-size:26px; letter-spacing:.02em; color:var(--ink);
  text-shadow:3px 3px 0 var(--pink); text-wrap:balance;
}
.spark{font-size:18px; color:var(--hot); line-height:1}
.spark.b{color:#6CC3DB; font-size:14px}
.count{display:flex; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border:2px solid var(--ink); border-radius:999px;
  background:var(--surface); font-size:12.5px; font-weight:700; box-shadow:var(--shadow-s); white-space:nowrap;
}
.pill-new{background:var(--pink)}

/* ---- 復古視窗 ---- */
.layout{flex:1 1 auto; display:flex; gap:16px; min-height:0}
.win{
  background:var(--surface); border:2px solid var(--ink); border-radius:14px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.win-bar{
  display:flex; align-items:center; gap:10px; padding:6px 12px; border-bottom:2px solid var(--ink);
  background:var(--sky); flex:0 0 auto;
}
.win-list .win-bar{background:var(--pink)}
.dots{display:flex; gap:5px}
.dots i{width:10px; height:10px; border-radius:50%; border:1.5px solid var(--ink); background:var(--surface)}
.dots i:first-child{background:var(--hot)}
.win-title{font-family:var(--font-pixel); font-size:13px; letter-spacing:.12em}
.win-list{width:380px; flex:0 0 380px}
.win-map{flex:1 1 auto; min-width:0}
#map{flex:1 1 auto; min-height:0; background:#EEF3F5}

/* ---- 工具列：每個條件一顆膠囊，點開下拉小視窗 ---- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; flex:0 0 auto; position:relative; z-index:1100}
.tb-pill{
  display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border:2px solid var(--ink); border-radius:999px;
  background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap;
  box-shadow:var(--shadow-s); font-variant-numeric:tabular-nums; transition:transform .1s;
}
.tb-pill:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.tb-pill:focus-visible{outline:3px solid var(--hot); outline-offset:2px}
.tb-pill.is-set, .tb-pill[aria-pressed="true"]{background:var(--pink)}
.tb-pill[aria-expanded="true"]{background:var(--sky)}
.tb-pill .caret{font-size:10px; opacity:.7}
.tb-pill .new-badge{margin-right:0; font-size:9.5px}
.tb-reset{background:var(--butter)}
.tb-pill.tb-drop[aria-pressed="true"]{background:var(--mint)}
.pop-layer{position:fixed; inset:0; z-index:1150; pointer-events:none}
.tb-pop{
  position:fixed; z-index:2; width:300px; padding:14px 16px 12px; pointer-events:auto;
  background:var(--surface); border:2px solid var(--ink); border-radius:14px; box-shadow:var(--shadow);
}
.tb-pop[hidden]{display:none}
.tb-pop h3{
  font-size:12.5px; font-weight:800; letter-spacing:.06em; margin:0 0 10px; display:flex; align-items:center; gap:6px;
}
.tb-pop h3::before{content:"✦"; color:var(--hot); font-size:12px}
.tb-pop .f-row{margin-bottom:4px}

/* ---- 排序 ---- */
.sort{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800}
.sort select{
  font:inherit; font-size:12px; font-weight:700; color:var(--ink); background:var(--surface);
  border:2px solid var(--ink); border-radius:999px; padding:2px 8px; cursor:pointer; max-width:190px;
}
.sort select:focus-visible{outline:3px solid var(--hot); outline-offset:1px}
.sort-val{background:var(--butter); color:var(--ink); border:1.5px solid var(--ink); border-radius:6px; padding:0 6px; font-weight:800}

/* ---- 篩選小視窗內部 ---- */
.f-row{margin-bottom:14px}
.f-row .f-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; font-weight:600}
.f-row .f-val{font-variant-numeric:tabular-nums; background:var(--chip-bg); border-radius:6px; padding:0 6px}
.range-wrap{position:relative; height:22px}
.range-wrap input[type=range]{position:absolute; top:5px; left:0; width:100%; margin:0; appearance:none; background:transparent; pointer-events:none}
.range-wrap input[type=range]::-webkit-slider-thumb{
  appearance:none; pointer-events:auto; width:18px; height:18px; border-radius:50%;
  background:var(--surface); border:2px solid var(--ink); cursor:pointer; margin-top:-6px;
}
.range-wrap input[type=range]::-moz-range-thumb{
  pointer-events:auto; width:15px; height:15px; border-radius:50%; background:var(--surface); border:2px solid var(--ink); cursor:pointer;
}
.range-wrap input[type=range]::-webkit-slider-runnable-track{height:6px; background:transparent}
.range-wrap input[type=range]::-moz-range-track{height:6px; background:transparent}
.range-wrap input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--hot); outline-offset:1px}
.range-track{position:absolute; top:6px; left:0; right:0; height:10px; border-radius:6px; background:var(--chip-bg); border:1.5px solid var(--ink)}
.range-fill{position:absolute; top:6px; height:10px; border-radius:6px; background:var(--sky); border:1.5px solid var(--ink)}
.grade-buttons{display:flex; gap:7px; flex-wrap:wrap}
.grade-btn{
  border:2px solid var(--ink); background:var(--surface); color:var(--muted); border-radius:999px;
  padding:3px 13px; font-size:13px; font-weight:800; cursor:pointer; user-select:none; transition:transform .1s;
}
.grade-btn[data-on="1"]{color:var(--ink); box-shadow:2px 2px 0 var(--ink)}
.grade-btn[data-on="0"]{border-style:dashed; opacity:.55}
.grade-btn[data-grade="A"][data-on="1"]{background:var(--grade-a)}
.grade-btn[data-grade="B"][data-on="1"]{background:var(--grade-b)}
.grade-btn[data-grade="C"][data-on="1"]{background:var(--grade-c)}
.grade-btn[data-grade="D"][data-on="1"]{background:var(--grade-d)}
.grade-btn[data-grade=""][data-on="1"]{background:var(--grade-x)}
.grade-btn:active{transform:translate(1px,1px)}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; font-weight:600}
.switch{position:relative; width:40px; height:22px; flex:0 0 auto}
.switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1}
.switch .track{position:absolute; inset:0; background:var(--surface); border:2px solid var(--ink); border-radius:999px; transition:.15s}
.switch .knob{position:absolute; top:4px; left:4px; width:14px; height:14px; border-radius:50%; background:var(--ink); transition:.15s}
.switch input:checked + .track{background:var(--pink)}
.switch input:checked + .track + .knob{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--hot); outline-offset:2px}
.poi-checks{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; font-weight:600}
.poi-checks label{display:flex; align-items:center; gap:5px; cursor:pointer}
.poi-checks input{accent-color:var(--hot)}
.poi-hint{font-size:11.5px; color:var(--muted); margin-top:6px; min-height:14px}

/* ---- 清單卡片 ---- */
#list{flex:1 1 auto; overflow-y:auto; padding:10px 12px 14px; display:flex; flex-direction:column; gap:10px}
.card{
  border:2px solid var(--ink); border-radius:12px; padding:10px 12px; cursor:pointer; background:var(--surface);
  transition:transform .12s, box-shadow .12s;
}
.card:hover{transform:translate(-1px,-1px); box-shadow:var(--shadow-s)}
.card.active{background:#EAF7FB; box-shadow:var(--shadow-s)}
.card.fav{background:#FFF8DC}
.card-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.card-name{font-size:14px; font-weight:800; line-height:1.4}
.chip{
  flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:2px solid var(--ink); color:var(--ink);
  font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center;
}
.card-right{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.fav-btn{
  border:none; background:none; cursor:pointer; font-size:22px; line-height:1; padding:0 2px; color:var(--ink); opacity:.45;
}
.fav-btn[aria-pressed="true"]{color:var(--fav); opacity:1; text-shadow:1px 1px 0 var(--ink)}
.fav-btn:focus-visible{outline:3px solid var(--hot); outline-offset:2px; border-radius:6px}
.new-badge{
  display:inline-block; margin-right:7px; padding:1px 7px; border:1.5px solid var(--ink); border-radius:6px; vertical-align:1px;
  background:var(--new); color:#fff; font-size:10.5px; font-weight:900; letter-spacing:.08em; transform:rotate(-5deg);
}
.drop-badge{
  display:inline-block; margin-right:7px; padding:1px 7px; border:1.5px solid var(--ink); border-radius:6px; vertical-align:1px;
  background:var(--mint); color:var(--ink); font-size:10.5px; font-weight:900; letter-spacing:.04em; transform:rotate(-5deg);
}
.was-price{color:var(--muted); font-weight:600; font-size:11.5px}
.drop-amt{background:var(--mint); color:var(--ink); border:1.5px solid var(--ink); border-radius:6px; padding:0 5px; font-weight:800; font-size:11.5px}
.card-meta{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:6px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.card-meta b{color:var(--ink); font-weight:800; font-size:13px}
.card-memo{
  margin-top:8px; font-size:12px; background:#FFF6FA; border:1.5px dashed var(--pink); border-radius:8px;
  padding:4px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.empty{padding:28px 12px; text-align:center; color:var(--muted); font-size:13px}

/* ---- 地圖：底圖降彩度、提高亮度，讓粉彩介面當主角；店名標籤仍可讀 ---- */
.leaflet-tile-pane{filter:saturate(.62) brightness(1.02) contrast(.96)}
.leaflet-container{font-family:var(--font-body)}
.leaflet-control-zoom{border:2px solid var(--ink)!important; border-radius:10px!important; box-shadow:var(--shadow-s)!important; overflow:hidden}
.leaflet-control-zoom a{color:var(--ink)!important; font-weight:900}
.marker-new{animation:new-pulse 1.4s ease-in-out infinite}
@keyframes new-pulse{0%,100%{stroke-width:3px; stroke-opacity:1} 50%{stroke-width:9px; stroke-opacity:.35}}
@media (prefers-reduced-motion: reduce){.marker-new{animation:none}}
.poi-pin{
  background:var(--surface); border:1.5px solid var(--ink); border-radius:50%;
  width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:.92;
}

/* ---- 彈窗：同樣的視窗語彙 ---- */
.leaflet-popup-content-wrapper{border:2px solid var(--ink); border-radius:14px; box-shadow:var(--shadow); background:var(--surface)}
.leaflet-popup-tip{border:2px solid var(--ink); box-shadow:none}
.leaflet-popup-content{font-size:13px; line-height:1.65; min-width:260px; max-width:300px; max-height:360px; overflow-y:auto; color:var(--ink)}
.leaflet-popup-content b{font-size:inherit}
.leaflet-popup-content a{color:var(--hot); font-weight:700}
.popup-fav{
  margin-top:8px; border:2px solid var(--ink); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:800; cursor:pointer; box-shadow:2px 2px 0 var(--ink);
}
.popup-fav[aria-pressed="true"]{background:var(--butter)}
.memo-label{margin-top:10px; font-size:11.5px; color:var(--muted); font-weight:700}
.memo-box{
  display:block; width:100%; margin-top:4px; min-height:64px; resize:vertical;
  font:inherit; font-size:12.5px; line-height:22px; color:var(--ink); border:2px solid var(--ink); border-radius:10px; padding:4px 10px;
  background:#FFFDF6 repeating-linear-gradient(transparent 0 21px, rgba(238,122,154,.25) 21px 22px);
  background-attachment:local;
}
.memo-box:focus{outline:3px solid var(--sky); outline-offset:0}

.sheet-handle, .sheet-count, .tb-backdrop{display:none}
.hide-sm{display:inline}

/* ---- 手機：地圖全螢幕，清單是從下方拉起的面板（收合／半版／全版三段） ---- */
@media (max-width:820px){
  body{height:100dvh; overflow:hidden; padding:10px 10px 0; gap:8px}
  header{flex-wrap:nowrap}
  header h1{font-size:19px; text-shadow:2px 2px 0 var(--pink)}
  .spark.b, .pill-count, .hide-sm{display:none}
  .pill{padding:4px 10px; font-size:11.5px}
  .toolbar{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-inline:-10px; padding:2px 10px 6px}
  .toolbar::-webkit-scrollbar{display:none}
  .tb-pill{padding:7px 12px}
  /* 小視窗接在按鈕列正下方（top 由 JS 設定），小箭頭指向按下的按鈕 */
  .tb-pop{
    position:fixed; left:10px; right:10px; width:auto; padding:18px 18px 16px;
  }
  .tb-pop::before{
    content:""; position:absolute; top:-8px; left:var(--arrow-x, 30px); width:14px; height:14px;
    background:var(--surface); border-top:2px solid var(--ink); border-left:2px solid var(--ink); transform:rotate(45deg);
  }
  .pop-layer.has-pop .tb-backdrop{
    display:block; position:absolute; inset:var(--tb-bottom, 0) 0 0 0; z-index:1; background:rgba(43,58,103,.25); pointer-events:auto;
  }
  .range-wrap{height:30px}
  .range-wrap input[type=range]{top:7px}
  .range-wrap input[type=range]::-webkit-slider-thumb{width:26px; height:26px; margin-top:-10px}
  .range-wrap input[type=range]::-moz-range-thumb{width:22px; height:22px}
  .range-track, .range-fill{top:10px}
  .grade-btn{padding:6px 16px}

  .layout{position:relative; display:block; margin-inline:-10px}
  .win-map{position:absolute; inset:0; z-index:0; border-radius:0; border-inline:none; border-bottom:none; box-shadow:none}
  .win-map > .win-bar{display:none}
  .win-list{
    position:absolute; left:0; right:0; bottom:0; z-index:2; width:auto;
    border-radius:18px 18px 0 0; border-bottom:none; box-shadow:0 -3px 0 var(--ink);
    transition:height .25s ease;
  }
  .win-list.dragging{transition:none}
  .sheet-grab{touch-action:none; cursor:grab; background:var(--pink); flex:0 0 auto}
  .sheet-handle{display:block; width:44px; height:5px; border-radius:3px; background:var(--ink); opacity:.55; margin:7px auto 0}
  .win-list .win-bar{padding:4px 12px 7px; border-bottom:2px solid var(--ink)}
  .win-list .dots{display:none}
  .sheet-count{display:inline; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums}
  #list{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .leaflet-popup-content{max-width:calc(100vw - 90px); max-height:42dvh}
}
@media (prefers-reduced-motion: reduce){.win-list{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="spark" aria-hidden="true">✦</span><h1>Nest Hunting Map</h1><span class="spark b" aria-hidden="true">✧</span></div>
  <div class="count" id="count"></div>
</header>
<nav class="toolbar" id="filters" aria-label="篩選條件"></nav>
<div class="pop-layer" id="popLayer"></div>
<div class="layout">
  <section class="win win-list" aria-label="物件清單">
    <div class="sheet-grab" id="sheetGrab">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="win-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="win-title">LISTINGS</span>
        <span class="sheet-count" id="sheetCount"></span>
        <label class="sort"><span class="sort-label">排序</span><select id="sortSel"></select></label>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <section class="win win-map" aria-label="地圖">
    <div class="win-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="win-title">MAP</span></div>
    <div id="map"></div>
  </section>
</div>
<script>

    <a href="${d.url}" target="_blank" rel="noopener">開啟 SUUMO ↗</a>
    ${d.mr_url ? ` ・ <a href="${d.mr_url}" target="_blank" rel="noopener">mansion-review ↗</a>` : ""}
    <br><a href="${gmaps}" target="_blank" rel="noopener">在 Google Maps 看周邊店家 ↗</a>
  </div>`;
  const fav = favs.has(d.id);
  const favBtn = `<button class="popup-fav" data-fav="${d.id}" aria-pressed="${fav}">${fav ? "★ 已加入最愛" : "☆ 加入最愛"}</button>`;
  const badge = badgeHtml(d);
  const memo = `<div class="memo-label">📝 memo（只存在這個瀏覽器，別人看不到）</div>
    <textarea class="memo-box" data-memo="${d.id}" placeholder="例：看屋日期、仲介電話、想確認的事…">${escapeHtml(memos[d.id] || "")}</textarea>`;
  return `${badge}<b style="font-size:14px">${escapeHtml(d.name)}</b><div style="margin-top:4px">${kv}</div>${comment}${links}${favBtn}${memo}`;
}

function selectItem(id, fly){
  state.selectedId = id;
  if(isMobile()) setSheet("peek");   // 手機：收起清單面板，讓彈窗不被蓋住
  document.querySelectorAll(".card").forEach(c=> c.classList.toggle("active", c.dataset.id===id));
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card) card.scrollIntoView({block:"nearest", behavior:"smooth"});
  const d = DATA.find(x=>x.id===id);
  if(d){
    if(fly) map.flyTo([d.lat,d.lng], 16, {duration:.6});
    markers[id].openPopup();
  }
}

// ---- 手機的清單面板：拖曳標題列調整高度，放開時吸附到最近的一段；點一下在收合／半版間切換 ----
const mq = window.matchMedia("(max-width:820px)");
const isMobile = () => mq.matches;
const sheet = document.querySelector(".win-list");
const sheetGrab = document.getElementById("sheetGrab");
function sheetHeights(){
  const H = sheet.parentElement.clientHeight;
  return {peek: sheetGrab.offsetHeight + 2, half: Math.round(H * .5), full: H};
}
function setSheet(name){
  if(!isMobile()){ sheet.style.height = ""; return; }
  sheet.dataset.sheet = name;
  sheet.style.height = sheetHeights()[name] + "px";
}
let drag = null;
sheetGrab.addEventListener("pointerdown", e=>{
  if(!isMobile() || e.target.closest(".sort")) return;
  drag = {y: e.clientY, h: sheet.getBoundingClientRect().height, moved: false};
  sheetGrab.setPointerCapture(e.pointerId);
  sheet.classList.add("dragging");
});
sheetGrab.addEventListener("pointermove", e=>{
  if(!drag) return;
  const dy = drag.y - e.clientY;
  if(Math.abs(dy) > 6) drag.moved = true;
  if(!drag.moved) return;
  const hs = sheetHeights();
  sheet.style.height = Math.min(hs.full, Math.max(hs.peek, drag.h + dy)) + "px";
});
function endDrag(){
  if(!drag) return;
  sheet.classList.remove("dragging");
  if(!drag.moved){
    setSheet(sheet.dataset.sheet === "peek" ? "half" : "peek");
  } else {
    const h = sheet.getBoundingClientRect().height, hs = sheetHeights();
    setSheet(Object.keys(hs).reduce((a, b)=> Math.abs(hs[a] - h) <= Math.abs(hs[b] - h) ? a : b));
  }
  drag = null;
}
sheetGrab.addEventListener("pointerup", endDrag);
sheetGrab.addEventListener("pointercancel", endDrag);
window.addEventListener("resize", ()=> setSheet(sheet.dataset.sheet || "half"));
if(isMobile()) map.attributionControl.setPosition("topright");   // 右下角會被面板蓋住
setSheet("half");

const markers = {};
DATA.forEach(d=>{
  const m = L.circleMarker([d.lat, d.lng], {...markerStyle(d), className: isToday(d) ? "marker-new" : ""}).addTo(map);
  m.bindPopup(()=> popupHtml(d), {autoPanPaddingTopLeft:[12, 12], autoPanPaddingBottomRight:[12, 90]});   // 用函式：每次打開都依最新的最愛／memo 重畫
  m.on("click", ()=> selectItem(d.id, false));
  markers[d.id] = m;
});
DATA.filter(isToday).forEach(d=> markers[d.id].bringToFront());   // 新增、最愛的圖釘不被其他圖釘蓋住
favs.forEach(id=> markers[id] && markers[id].bringToFront());

function toggleFav(id){
  if(favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
  const d = DATA.find(x=>x.id===id);
  if(d){
    markers[id].setStyle(markerStyle(d));
    if(favs.has(id)) markers[id].bringToFront();
    if(markers[id].isPopupOpen()) markers[id].getPopup().update();
  }
  applyFilters();
}
// 彈窗裡的按鈕：委派在常駐的 popupPane 上（setPopupContent 會重畫彈窗內容，按鈕元素會換新）
map.getPane("popupPane").addEventListener("click", e=>{
  const b = e.target.closest("[data-fav]");
  if(b) toggleFav(b.dataset.fav);
});
map.getPane("popupPane").addEventListener("input", e=>{
  const t = e.target.closest("[data-memo]");
  if(!t) return;
  const id = t.dataset.memo;
  saveMemo(id, t.value);
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if(card){ card.querySelector(".card-memo")?.remove(); card.insertAdjacentHTML("beforeend", memoSnippetHtml(id)); }
});
map.getPane("popupPane").addEventListener("keydown", e=>{ if(e.target.closest("[data-memo]")) e.stopPropagation(); });

const POI_ICON = {supermarket:"🛒", convenience:"🏪", park:"🌳", clinic:"🏥"};
// 設施放在物件圖層（overlayPane, z=400）下面的自訂圖層，才不會蓋住物件圖釘
map.createPane("poi"); map.getPane("poi").style.zIndex = 350;
const poiLayer = L.layerGroup().addTo(map);

function renderPOIs(){
  const hint = document.getElementById("poiHint");
  poiLayer.clearLayers();
  if(map.getZoom() < 16){
    hint.textContent = POI_DATA.length ? "把地圖拉近到街廓層級才會顯示設施圖示" : "";
    return;
  }
  const checked = new Set([...document.querySelectorAll("[data-poi]")].filter(c=>c.checked).map(c=>c.dataset.poi));
  const b = map.getBounds();
  let shown = 0;
  POI_DATA.forEach(p=>{
    if(!checked.has(p.kind)) return;
    if(!b.contains([p.lat, p.lng])) return;
    const icon = L.divIcon({html:`<div class="poi-pin">${POI_ICON[p.kind]}</div>`, className:"", iconSize:[20,20], iconAnchor:[10,10]});
    L.marker([p.lat, p.lng], {icon, pane:"poi"}).bindPopup(escapeHtml(p.name || "（無名稱）")).addTo(poiLayer);
    shown++;
  });
  hint.textContent = POI_DATA.length ? `顯示 ${shown} 個設施（目前地圖範圍內）` : "尚未匯入設施資料，執行 python main.py fetch-poi";
}
map.on("moveend zoomend", renderPOIs);

function passes(d){
  for(const r of RANGE_DEFS){
    const v = d[r.key];
    if(v==null) continue;
    const [lo,hi]=state[r.key];
    if(v<lo || v>hi) return false;
  }
  if(!state.grades[d.grade || ""]) return false;
  if(state.excludeSelfManaged && d.kanri_self_managed) return false;
  if(state.excludeTaishinRisk && (d.taishin_level||0)>=2) return false;
  if(state.onlyFavs && !favs.has(d.id)) return false;
  if(state.onlyNew && !isToday(d)) return false;
  if(state.onlyDrop && !hasDrop(d)) return false;
  return true;
}

function recommendCmp(a, b){
  return (favs.has(b.id) - favs.has(a.id)) || (isToday(b) - isToday(a))
    || (b.score??-1) - (a.score??-1) || (a.price_man??0) - (b.price_man??0);
}
function renderList(items){
  const s = SORTS.find(x=>x.id===state.sort) || SORTS[0];
  if(!s.key) items.sort(recommendCmp);
  else items.sort((a,b)=>{
    const va = s.key(a), vb = s.key(b);
    if(va==null || vb==null) return (va==null) - (vb==null);   // 沒有資料的排最後
    return (va - vb) * s.dir || (a.price_man??0) - (b.price_man??0);
  });
  if(!items.length){
    listEl.innerHTML = `<div class="empty">${state.onlyFavs ? "還沒有最愛的物件（點卡片右上角的 ☆ 收藏）" : state.onlyNew ? "這次沒有新增或降價的物件" : state.onlyDrop ? "目前沒有降價的物件" : "沒有符合條件的物件"}</div>`;
    return;
  }
  listEl.innerHTML = items.map(d=>{
    const fav = favs.has(d.id);
    const sortVal = s.show && s.key(d) != null ? `<span class="sort-val">${s.show(d)}</span>` : "";
    return `
    <div class="card${fav ? " fav" : ""}${d.id===state.selectedId ? " active" : ""}" data-id="${d.id}">
      <div class="card-top">
        <div class="card-name">${badgeHtml(d)}${escapeHtml(d.name)}</div>
        <div class="card-right">
          <button class="fav-btn" data-fav="${d.id}" aria-pressed="${fav}" title="${fav ? "取消最愛" : "加入最愛"}">${fav ? "★" : "☆"}</button>
          <div class="chip" style="background:${GRADE_COLOR[d.grade||""]}">${d.grade || "-"}</div>
        </div>
      </div>
      <div class="card-meta">
        ${sortVal}
        <span>${priceHtml(d)}</span>
        <span>${escapeHtml(d.station)} 徒步${d.walk_min ?? "-"}分</span>
        <span>${d.layout||""} ${d.area_m2 ?? "-"}m²</span>
        <span>${d.built_text||""}</span>
        <span>${d.total_units ? d.total_units+"戶" : "戶數未知"}</span>
        <span>${escapeHtml(d.kanri_type||"")}</span>
        ${d.kanri_self_managed ? '<span style="color:var(--grade-d)">⚠自主管理</span>' : ""}
      </div>
      ${memoSnippetHtml(d.id)}
    </div>`;
  }).join("");
}
// 清單點擊委派：星星切換最愛，其他地方飛到該物件
listEl.addEventListener("click", e=>{
  const b = e.target.closest("[data-fav]");
  if(b){ toggleFav(b.dataset.fav); return; }
  const card = e.target.closest(".card");
  if(card) selectItem(card.dataset.id, true);
});

function applyFilters(){
  const shown = DATA.filter(passes);
  const shownIds = new Set(shown.map(d=>d.id));
  Object.entries(markers).forEach(([id,m])=>{
    const el = m.getElement();
    if(el) el.style.display = shownIds.has(id) ? "" : "none";
  });
  renderList(shown);
  const newCount = DATA.filter(isNew).length, dropCount = DATA.filter(isDrop).length;
  countEl.innerHTML = `<span class="pill pill-count">顯示 ${shown.length} / ${DATA.length} 件</span>`
    + `<span class="pill pill-new">✦ <span class="hide-sm">本次</span>新增 ${newCount} 件${dropCount ? `・降價 ${dropCount} 件` : ""}<span class="hide-sm">・${GEN_DATE.slice(5).replace("-", "/")}</span></span>`;
  document.getElementById("sheetCount").textContent = `${shown.length} 件`;
  refreshPills();
}

// ---- 工具列：每個條件一顆膠囊按鈕，點開小視窗調整；有設定的按鈕變色並顯示目前的值 ----
// 小視窗不放在工具列裡：手機版工具列可橫向捲動，iOS Safari 會把裡面的 fixed 元素裁掉。
const popLayer = document.getElementById("popLayer");
const POPS = [];
function popHtml(id, label, body){
  POPS.push(`<div class="tb-pop" id="pop-${id}" role="dialog" aria-label="${label}" hidden>${body}</div>`);
  return `<button class="tb-pill" data-pop="${id}" aria-expanded="false" aria-controls="pop-${id}"><span class="tb-label">${label}</span><span class="caret" aria-hidden="true">▾</span></button>`;
}
const toggleRow = (id, text) => `<div class="toggle-row"><span>${text}</span>
  <label class="switch"><input type="checkbox" id="${id}"><span class="track"></span><span class="knob"></span></label></div>`;

filtersEl.innerHTML =
  RANGE_DEFS.map(r=> popHtml(r.key, r.short, `
    <div class="f-row" data-key="${r.key}">
      <div class="f-label"><span>${r.label}</span><span class="f-val"></span></div>
      <div class="range-wrap">
        <div class="range-track"></div><div class="range-fill"></div>
        <input type="range" class="lo" min="${r.min}" max="${r.max}" value="${r.min}" aria-label="${r.short}下限">
        <input type="range" class="hi" min="${r.min}" max="${r.max}" value="${r.max}" aria-label="${r.short}上限">
      </div>
    </div>`)).join("")
  + popHtml("grade", "AI 等級", `<h3>AI 等級</h3>
    <div class="grade-buttons">

  + `<button class="tb-pill tb-drop" id="tgDrop" aria-pressed="false" title="最近一次價格變動是降價的物件">↓ 降價 <span id="dropCount"></span></button>`
  + `<button class="tb-pill" id="tgFav" aria-pressed="false">★ 最愛 <span id="favCount"></span></button>`

  + popHtml("poi", "周邊設施", `<h3>周邊設施（放大地圖時顯示）</h3>
    <div class="poi-checks">

    </div>
    <div class="poi-hint" id="poiHint"></div>`)
  + `<button class="tb-pill tb-reset" id="resetBtn">↺ 重設</button>`;
popLayer.innerHTML = `<div class="tb-backdrop" aria-hidden="true"></div>` + POPS.join("");

function fmtRange(r){
  const [a, b] = state[r.key];
  if(a <= r.min && b >= r.max) return null;
  const f = v => Number(v).toLocaleString("ja-JP") + r.unit;
  return a <= r.min ? `〜${f(b)}` : b >= r.max ? `${f(a)}〜` : `${f(a)}〜${f(b)}`;
}
function setPill(key, text, isSet){
  const btn = filtersEl.querySelector(`[data-pop="${key}"]`);
  btn.querySelector(".tb-label").textContent = text;
  btn.classList.toggle("is-set", isSet);
}
function refreshPills(){
  RANGE_DEFS.forEach(r=>{ const v = fmtRange(r); setPill(r.key, v ? `${r.short} ${v}` : r.short, !!v); });
  const on = ["A","B","C","D",""].filter(g=>state.grades[g]);
  setPill("grade", on.length === 5 ? "AI 等級" : "等級 " + (on.map(g=>g || "未評").join("・") || "無"), on.length !== 5);
  const risk = state.excludeSelfManaged + state.excludeTaishinRisk;
  setPill("risk", risk ? `風險排除 ${risk} 項` : "風險排除", risk > 0);
  const poiOn = [...document.querySelectorAll("[data-poi]")].filter(c=>c.checked).length;
  setPill("poi", poiOn === 4 ? "周邊設施" : `周邊設施 ${poiOn}/4`, poiOn !== 4);
  document.getElementById("tgNew").setAttribute("aria-pressed", state.onlyNew);
  document.getElementById("tgDrop").setAttribute("aria-pressed", state.onlyDrop);
  document.getElementById("dropCount").textContent = DATA.filter(hasDrop).length;
  const tgFav = document.getElementById("tgFav");
  tgFav.setAttribute("aria-pressed", state.onlyFavs);
  const ids = new Set(DATA.map(d=>d.id));
  const gone = [...favs].filter(id=>!ids.has(id)).length;
  document.getElementById("favCount").textContent = favs.size - gone;
  tgFav.title = gone ? `另有 ${gone} 件最愛已不在清單（可能已下架）` : "只看最愛";
}

let openPop = null;
function closePop(){
  if(!openPop) return;
  openPop.btn.setAttribute("aria-expanded", "false");
  openPop.pop.hidden = true;
  openPop = null;
  popLayer.classList.remove("has-pop");
}
filtersEl.addEventListener("click", e=>{
  const btn = e.target.closest("[data-pop]");
  if(!btn) return;
  const pop = document.getElementById("pop-" + btn.dataset.pop);
  const wasOpen = openPop && openPop.pop === pop;
  closePop();
  if(wasOpen) return;
  pop.hidden = false;
  const r = btn.getBoundingClientRect();
  if(isMobile()){   // 手機：滿版寬、接在按鈕列正下方；背景變暗的範圍也從按鈕列下方開始，按鈕仍可直接切換
    const tb = filtersEl.getBoundingClientRect().bottom;
    popLayer.style.setProperty("--tb-bottom", tb + "px");
    pop.style.top = (tb + 10) + "px"; pop.style.left = "";
    pop.style.setProperty("--arrow-x", Math.max(14, Math.min(r.left + r.width / 2 - 17, window.innerWidth - 50)) + "px");
  } else {
    pop.style.top = (r.bottom + 8) + "px";
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 12)) + "px";
  }
  btn.setAttribute("aria-expanded", "true");
  openPop = {btn, pop};
  popLayer.classList.add("has-pop");
});
document.addEventListener("click", e=>{ if(openPop && !e.target.closest(".tb-pop, [data-pop]")) closePop(); });
// 桌機：視窗大小改變時位置會跑掉，直接關閉。手機的小視窗固定在畫面下方，不需要；
// 而且 iOS 網址列收合也會觸發 resize，關掉反而會讓小視窗一打開就消失。
window.addEventListener("resize", ()=>{ if(!isMobile()) closePop(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closePop(); });

RANGE_DEFS.forEach(r=>{
  const row = popLayer.querySelector(`.f-row[data-key="${r.key}"]`);
  const lo = row.querySelector(".lo"), hi = row.querySelector(".hi");
  const fill = row.querySelector(".range-fill"), val = row.querySelector(".f-val");
  function updateVisual(){
    let a = parseFloat(lo.value), b = parseFloat(hi.value);
    if(a>b){ [a,b]=[b,a]; }
    state[r.key]=[a,b];
    const pctA = (a-r.min)/(r.max-r.min)*100, pctB=(b-r.min)/(r.max-r.min)*100;
    fill.style.left = pctA+"%"; fill.style.width = Math.max(0,pctB-pctA)+"%";
    val.textContent = `${a.toLocaleString("ja-JP")} – ${b.toLocaleString("ja-JP")}`;
  }
  lo.addEventListener("input", ()=>{ updateVisual(); applyFilters(); });
  hi.addEventListener("input", ()=>{ updateVisual(); applyFilters(); });
  updateVisual();
});
popLayer.querySelectorAll(".grade-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const g = btn.dataset.grade;
    state.grades[g] = !state.grades[g];
    btn.dataset.on = state.grades[g] ? "1" : "0";
    applyFilters();
  });
});
document.getElementById("tgSelf").addEventListener("change", e=>{ state.excludeSelfManaged = e.target.checked; applyFilters(); });
document.getElementById("tgTaishin").addEventListener("change", e=>{ state.excludeTaishinRisk = e.target.checked; applyFilters(); });
document.getElementById("tgNew").addEventListener("click", ()=>{ state.onlyNew = !state.onlyNew; applyFilters(); });
document.getElementById("tgDrop").addEventListener("click", ()=>{ state.onlyDrop = !state.onlyDrop; applyFilters(); });
document.getElementById("tgFav").addEventListener("click", ()=>{ state.onlyFavs = !state.onlyFavs; applyFilters(); });
document.getElementById("resetBtn").addEventListener("click", ()=>{
  closePop();
  RANGE_DEFS.forEach(r=>{
    const row = popLayer.querySelector(`.f-row[data-key="${r.key}"]`);
    row.querySelector(".lo").value = r.min; row.querySelector(".hi").value = r.max;
    row.querySelector(".lo").dispatchEvent(new Event("input"));
  });
  popLayer.querySelectorAll(".grade-btn").forEach(b=>{ b.dataset.on="1"; state.grades[b.dataset.grade]=true; });
  document.getElementById("tgSelf").checked=false; state.excludeSelfManaged=false;
  document.getElementById("tgTaishin").checked=false; state.excludeTaishinRisk=false;
  state.onlyFavs=false; state.onlyNew=false; state.onlyDrop=false;
  applyFilters();
});
document.querySelectorAll("[data-poi]").forEach(cb=> cb.addEventListener("change", ()=>{ renderPOIs(); refreshPills(); }));
renderPOIs();

const sortSel = document.getElementById("sortSel");
sortSel.innerHTML = SORTS.map(x=>`<option value="${x.id}">${x.label}</option>`).join("");
sortSel.value = state.sort;
sortSel.addEventListener("change", ()=>{
  state.sort = sortSel.value;
  try{ localStorage.setItem(SORT_KEY, state.sort); }catch(e){}
  applyFilters();
  listEl.scrollTop = 0;
});

applyFilters();
</script>
</body>
</html>
